[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "1.1.0"
description = "A modular, NumPy-only machine-learning toolkit (numcompute) and its streaming decision-tree extension (numcompute_stream)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "matplotlib>=3.5"]
keywords = ["numpy", "machine-learning", "streaming", "decision-tree", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "ipykernel"]

[tool.setuptools]
packages = ["numcompute", "numcompute_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["numcompute", "numcompute_stream"]
